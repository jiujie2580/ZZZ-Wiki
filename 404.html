<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | 绝区零 Wiki</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="notfound">
  <div id="app">
    <header id="app-header"></header>
    <div class="layout">
      <aside id="app-sidebar"></aside>
      <main id="app-main">
        <nav id="breadcrumb" class="breadcrumb"></nav>
        <div id="content"></div>
      </main>
    </div>
    <footer id="app-footer"></footer>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core/data-loader.js"></script>
  <script src="assets/js/core/router.js"></script>
  <script src="assets/js/core/components.js"></script>
  <script src="assets/js/core/layout.js"></script>
  <script src="assets/js/core/search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.ZZZUI) return;
      window.ZZZUI.breadcrumb([{ label: '404' }]);

      // 热门栏目（复用首页 module-card 样式，链接统一走 window.ZZZ.pages）
      var popular = [
        { page: 'characters', icon: 'character', title: '角色' },
        { page: 'factions',   icon: 'faction',   title: '势力 / 组织' },
        { page: 'story',      icon: 'story',     title: '剧情' },
        { page: 'glossary',   icon: 'glossary',  title: '术语' },
        { page: 'timeline',   icon: 'timeline',  title: '时间线' },
        { page: 'locations',  icon: 'region',    title: '地区' },
        { page: 'worldview',  icon: 'world',     title: '世界观' },
        { page: 'changelog',  icon: 'update',    title: '更新日志' }
      ];
      function iconSvg(name) {
        return '<svg class="icon"><use href="' + window.ZZZ.iconBase + '#' + name + '"></use></svg>';
      }
      var cards = popular.map(function (m) {
        return '<a class="module-card" href="' + window.ZZZ.pages[m.page] + '">' +
          '<div class="module-icon">' + iconSvg(m.icon) + '</div>' +
          '<div class="module-title">' + window.ZZZUI.esc(m.title) + '</div></a>';
      }).join('');

      var c = document.getElementById('content');
      c.innerHTML =
        '<section class="page-hero nf-hero">' +
          '<div class="nf-code">404</div>' +
          '<h1>页面未找到</h1>' +
          '<p class="hero-sub">你访问的页面不存在，或已在新版本中移动 / 重命名。</p>' +
          '<div class="nf-actions">' +
            '<a class="nf-btn nf-btn-primary" href="index.html">← 返回首页</a>' +
            '<a class="nf-btn" href="search.html">站内搜索 ↗</a>' +
          '</div>' +
        '</section>' +
        '<section class="detail-section">' +
          '<h2>热门栏目</h2>' +
          '<div class="module-grid">' + cards + '</div>' +
        '</section>';
    });
  </script>
</body>
</html>
